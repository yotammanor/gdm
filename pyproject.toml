[project]
name = "google-drive-model"
version = "0.1.1"
description = "Pydantic models and a SQLModel-inspired API for Google Drive and Sheets"
readme = "README.md"
authors = [
    { name = "Yotam Manor" }
]
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "google-drive",
    "google-sheets",
    "orm",
    "odm",
    "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "google-api-python-client>=2.160.0",
    "google-auth>=2.37.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
oauth = ["google-auth-oauthlib>=1.2.1"]
yaml = ["pyyaml>=6.0.2"]

[project.scripts]
gdm = "gdm.cli:app"

[project.urls]
Changelog = "https://github.com/yotammanor/gdm/blob/main/CHANGELOG.md"
Documentation = "https://yotammanor.github.io/gdm/"
Issues = "https://github.com/yotammanor/gdm/issues"
Repository = "https://github.com/yotammanor/gdm"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "google-auth-oauthlib>=1.2.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.28.0",
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.0",
    "twine>=6.1.0",
    "ty>=0.0.1a18",
]

[tool.uv.build-backend]
module-name = "gdm"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]
markers = [
    "live: uses a real Google Drive account",
]

[tool.coverage.run]
branch = true
source = ["gdm"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PT",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "SIM117"]
"tests/test_structured_codecs.py" = ["ANN", "SIM117"]
"tests/test_google_api_extra.py" = ["N802"]
"src/gdm/google_api.py" = ["N802", "N803", "A002"]
"src/gdm/auth.py" = ["N806"]
"src/gdm/errors.py" = ["N818"]
"src/gdm/backends/drive.py" = ["N803"]
"src/gdm/backends/sheets.py" = ["N803", "A002", "N802"]
"src/gdm/permissions.py" = ["N803"]
"src/gdm/sync.py" = ["N803", "N802"]
"src/gdm/project.py" = ["N803"]
"src/gdm/fields.py" = ["A002"]
"src/gdm/collection/metadata.py" = ["N803"]
"tests/collection_fakes.py" = ["N802", "N803", "SIM102"]
"tests/fakes.py" = ["N802", "N803", "A002", "SIM102", "E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src"]
